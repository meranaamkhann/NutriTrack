services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutritrack
      POSTGRES_PASSWORD: nutritrack
      POSTGRES_DB: nutritrack
    ports:
      # Host port is configurable: POSTGRES_PORT=5434 docker compose up -d
      # (then use the same port in DATABASE_URL). Defaults to 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - nutritrack_pg:/var/lib/postgresql/data
volumes:
  nutritrack_pg:
